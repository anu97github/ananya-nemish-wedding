<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice">
<defs>
 <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="19" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
 </filter>
 <filter id="wash" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="3" seed="7" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  <feGaussianBlur stdDeviation="12"/>
 </filter>
 <radialGradient id="soft"><stop stop-color="#fffaf5" stop-opacity=".42"/><stop offset="1" stop-color="#fffaf5" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1536" height="1024" fill="#F1E9E2"/>
